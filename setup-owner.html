<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24102f"><link rel="stylesheet" href="/manage/style.css"><title>Set up C&J owner account</title></head><body><section class="login-screen"><div class="login-card"><img src="/logo.jpg" alt="C&J logo"><span class="eyebrow">ONE-TIME SECURE SETUP</span><h1>Create owner<br>account</h1><p>This page works only before the first owner account is created. Keep your setup key private.</p><form id="setup"><label>One-time setup key<input name="bootstrapSecret" type="password" required></label><label>Your name<input name="name" required></label><label>Owner email<input name="email" type="email" required></label><label>New password (10+ characters)<input name="password" type="password" minlength="10" required></label><button class="btn">Create owner account</button><div id="msg" class="error"></div></form><a href="/manage/">Go to management sign in →</a></div></section><script>document.getElementById('setup').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');try{const r=await fetch('/api/setup/owner',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok)throw Error(d.error);msg.style.color='#16845b';msg.textContent='Owner account created. Go to management sign in.';e.target.reset();}catch(x){msg.textContent=x.message;}};</script></body></html>
